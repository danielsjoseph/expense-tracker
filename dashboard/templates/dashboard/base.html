<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1a1d24;
        --text: #e8e8ec;
        --muted: #9aa0ac;
        --border: #2a2e37;
        --accent: #5b9dff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.95rem;
    }
    header a:hover { color: var(--accent); }
    header .brand { font-weight: 600; margin-left: 0; font-size: 1.05rem; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 600; }
    input, select, button {
      font: inherit;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .stat { font-size: 1.6rem; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div>
      <a href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'home' %}{% endif %}" style="text-decoration:none; color:inherit">
        <span class="brand">Expense Tracker</span>
      </a>
      {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'expenses' %}">Update Expenses</a>
      <a href="{% url 'income' %}">Update Income</a>
      {% endif %}
    </div>
    {% if user.is_authenticated %}
    <div>
      <span class="muted">{{ user.email }}</span>
      <a href="/admin/">Admin</a>
      <a href="{% url 'logout' %}">Log out</a>
    </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
