{% extends "dashboard/base.html" %}
{% block title %}Log in - Expense Tracker{% endblock %}
{% block content %}

<div class="card" style="max-width:420px; margin:2rem auto">
  <h2 style="margin-top:0">Log in</h2>
  <p class="muted">Enter your email and we'll send you a one-time code — no password needed.</p>

  <form id="emailForm">
    <input type="email" id="emailInput" placeholder="you@example.com" style="width:100%" required>
    <button type="submit" id="sendCodeBtn" style="margin-top:0.5rem; width:100%">Send code</button>
    <p id="emailStatus" class="muted"></p>
  </form>

  <form id="codeForm" style="display:none; margin-top:1rem">
    <p class="muted">Enter the 6-digit code sent to <span id="codeEmailLabel"></span>.</p>
    <input type="text" id="codeInput" placeholder="123456" inputmode="numeric" pattern="\d{6}" maxlength="6" style="width:100%" required>
    <button type="submit" style="margin-top:0.5rem; width:100%">Verify and log in</button>
    <button type="button" id="resendBtn" class="secondary" style="margin-top:0.5rem; width:100%">Use a different email</button>
    <p id="codeStatus" class="muted"></p>
  </form>
</div>

<script>
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : null;
  }

  async function postJson(url, payload) {
    return fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken') || '',
      },
      body: JSON.stringify(payload),
    });
  }

  const emailForm = document.getElementById('emailForm');
  const codeForm = document.getElementById('codeForm');
  const emailInput = document.getElementById('emailInput');
  const emailStatus = document.getElementById('emailStatus');
  const codeStatus = document.getElementById('codeStatus');
  const sendCodeBtn = document.getElementById('sendCodeBtn');

  emailForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    sendCodeBtn.disabled = true;
    emailStatus.style.color = '';
    emailStatus.textContent = 'Sending code...';
    try {
      const res = await postJson('/api/auth/request-otp/', { email: emailInput.value });
      if (res.ok) {
        emailStatus.textContent = '';
        document.getElementById('codeEmailLabel').textContent = emailInput.value;
        emailForm.style.display = 'none';
        codeForm.style.display = 'block';
        document.getElementById('codeInput').focus();
      } else {
        const data = await res.json();
        emailStatus.style.color = '#ef4444';
        emailStatus.textContent = data.detail || 'Could not send the code.';
        sendCodeBtn.disabled = false;
      }
    } catch (err) {
      emailStatus.style.color = '#ef4444';
      emailStatus.textContent = 'Could not reach the server.';
      sendCodeBtn.disabled = false;
    }
  });

  codeForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    codeStatus.style.color = '';
    codeStatus.textContent = 'Verifying...';
    try {
      const res = await postJson('/api/auth/verify-otp/', {
        email: emailInput.value,
        code: document.getElementById('codeInput').value,
      });
      if (res.ok) {
        codeStatus.style.color = '#22c55e';
        codeStatus.textContent = 'Logged in — redirecting...';
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '{% url "dashboard" %}';
      } else {
        const data = await res.json();
        codeStatus.style.color = '#ef4444';
        codeStatus.textContent = data.detail || 'Invalid or expired code.';
      }
    } catch (err) {
      codeStatus.style.color = '#ef4444';
      codeStatus.textContent = 'Could not reach the server.';
    }
  });

  document.getElementById('resendBtn').addEventListener('click', () => {
    codeForm.style.display = 'none';
    emailForm.style.display = 'block';
    codeStatus.textContent = '';
    sendCodeBtn.disabled = false;
  });
</script>
{% endblock %}
